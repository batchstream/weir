name: Publish

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  image:
    if: github.repository == 'batchstream/weir'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/batchstream/weir
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=,enable=${{ github.event_name == 'push' }}
            type=semver,pattern=v{{version}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
      - name: Smoke-run the published image
        env:
          IMAGE: ghcr.io/batchstream/weir@${{ steps.build.outputs.digest }}
        run: |
          version=$(docker run --rm --pull=always --network=none "$IMAGE" version)
          echo "$version"
          test "$(jq -r .revision <<<"$version")" = "$GITHUB_SHA"

  archives:
    if: github.repository == 'batchstream/weir' && github.event_name == 'release'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build archives
        run: |
          dist=$RUNNER_TEMP/dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            name=weir-${target%/*}-${target#*/}
            mkdir -p "$dist/$name/config"
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -buildvcs=false \
              -ldflags "-buildid= -X main.revision=$GITHUB_SHA" -o "$dist/$name/weir" ./cmd/weir
            cp README.md "$dist/$name/"
            cp config/weir.reference.yaml "$dist/$name/config/"
            tar -czf "$dist/$name.tar.gz" --owner=0 --group=0 --numeric-owner -C "$dist/$name" weir README.md config
          done
          cd "$dist" && sha256sum weir-*.tar.gz > SHA256SUMS
      - name: Attach archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/weir-*.tar.gz "$RUNNER_TEMP/dist/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY"
