name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: weir-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOENV: 'off'
  GOWORK: 'off'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  GOPROXY: 'off'
  GOSUMDB: 'off'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare fixed native SDK and public modules
        run: python3 scripts/ci-tools.py test
      - name: Native CGO0 default tests
        run: |
          python3 scripts/check_dependencies.py
          CGO_ENABLED=0 timeout 12m go test -count=1 -timeout=180s ./...
      - name: Native CGO1 race tests
        run: CGO_ENABLED=1 timeout 12m go test -race -count=1 -timeout=180s ./...
      - name: Node retirement and process stop integration tests
        run: |
          CGO_ENABLED=1 timeout 2m go test -p=1 -parallel=1 -tags=integration -count=1 -timeout=90s -run '^(TestProcessStop(TerminalMeasurements|OnceConcurrent)|TestOfflineRetirement(NodeJoinsDefaultOwners|SIGTERMActualNode))$' -v ./internal/app
          CGO_ENABLED=1 timeout 2m go test -race -p=1 -parallel=1 -tags=integration -count=1 -timeout=90s -run '^(TestProcessStop(TerminalMeasurements|OnceConcurrent)|TestOfflineRetirement(NodeJoinsDefaultOwners|SIGTERMActualNode))$' -v ./internal/app
      - name: Static vet and script tests
        run: |
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go vet -tags=integration ./...
          python3 -m unittest discover -v -s scripts -p '*_test.py'
          git diff --exit-code

  search-integration:
    name: search-integration-${{ matrix.product }}
    strategy:
      fail-fast: false
      matrix:
        product: [elasticsearch, opensearch]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare fixed native SDK and public modules
        run: python3 scripts/ci-tools.py test
      - name: Start local ${{ matrix.product }} fixture with normal capacity
        run: scripts/search-local.sh start ${{ matrix.product }} normal
      - name: Search backend and CLI integration tests
        env:
          WEIR_SEARCH_INTEGRATION: ${{ matrix.product }}
        run: |
          go test -p=1 -tags=integration -count=1 -timeout=10m -skip '^(TestSearchRealBackendCongestion|TestSearchExpressionRealCapacity)$' ./internal/backend/search
          go test -tags=integration -count=1 -timeout=5m -run '^TestProcessSearchCRUD$' -v ./internal/app
      - name: Search capacity-rejection tests with the overload fixture
        env:
          WEIR_SEARCH_INTEGRATION: ${{ matrix.product }}
        run: |
          scripts/search-local.sh stop ${{ matrix.product }}
          scripts/search-local.sh start ${{ matrix.product }} overload
          go test -tags=integration -count=1 -timeout=5m -run '^(TestSearchRealBackendCongestion|TestSearchExpressionRealCapacity)$' -v ./internal/backend/search
      - name: Stop local ${{ matrix.product }} fixture
        if: always()
        run: scripts/search-local.sh stop ${{ matrix.product }}

  process-integration:
    name: process-integration-${{ matrix.product }}
    strategy:
      fail-fast: false
      matrix:
        product: [elasticsearch, opensearch]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare fixed native SDK, public modules and MongoDB
        run: python3 scripts/ci-tools.py test --mongo
      - name: Start local MongoDB and ${{ matrix.product }} fixtures
        run: |
          docker pull busybox:1.37.0
          # CLI containers reach mongod through the Docker bridge gateway.
          gateway=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          test -n "$gateway"
          WEIR_MONGOD="$WEIR_MONGO_REPLICA_BINARY" WEIR_MONGO_BIND="$gateway" scripts/mongo-local.sh start
          scripts/search-local.sh start ${{ matrix.product }} normal
      - name: CLI fault and short load tests
        env:
          WEIR_INTEGRATION: '1'
          WEIR_SEARCH_INTEGRATION: ${{ matrix.product }}
          WEIR_FAULT_INTEGRATION: '1'
          WEIR_LOAD_INTEGRATION: '1'
          WEIR_LOAD_MEASUREMENT: 1m
        run: |
          go test -tags=integration -count=1 -timeout=8m -run '^TestProcessFaults$' -v ./internal/app
          go test -tags=integration -count=1 -timeout=8m -run '^TestProcessLoad$' -v ./internal/app
      - name: Stop local fixtures
        if: always()
        run: |
          status=0
          scripts/search-local.sh stop ${{ matrix.product }} || status=1
          scripts/mongo-local.sh stop || status=1
          exit "$status"

  native-mongo-replica:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare fixed native SDK, public modules and MongoDB
        run: python3 scripts/ci-tools.py test --mongo
      - name: MongoDB replica-set discovery, reply loss and read retirement
        env:
          CGO_ENABLED: '1'
          WEIR_MONGO_REPLICA_INTEGRATION: '1'
        run: |
          go test -race -p=1 -parallel=1 -tags=integration -count=1 -timeout=10m \
            -run '^TestMongoReplica(DiscoveryOwnership|ProxyDiscoveryRecovery|CLIRecovery)$' -v \
            ./internal/backend/mongodb ./internal/app
          go test -race -p=1 -parallel=1 -tags=integration -count=1 -timeout=10m \
            -run '^TestMongoReplicaCLIReplyLoss$/^plain$' -v ./internal/app
          go test -race -p=1 -parallel=1 -tags=integration -count=1 -timeout=10m \
            -run '^TestMongoReplicaCLIReplyLoss$/^tls$' -v ./internal/app
