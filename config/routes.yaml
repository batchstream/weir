# Local Store definitions. Select this file with --routes.
# Remote Store addresses are learned through peer directory synchronization.
# Backend database/collection/index targets come from each business request URI.
# A node may host 0..16 Stores. Empty/missing stores is valid for discovery-only nodes.
# name is a unique lowercase Store name, at most 63 bytes; exactly one backend
# (mongodb or search) is required. No databases/collections/indexes are configured.
# max_concurrency: default 2; explicit 0 selects default; effective range 1..32.
# max_batch_operations: default 32; explicit 0 selects default; range 1..128.
# batch_collect: default 5ms; range 0s..10ms; explicit zero disables collection wait.
# max_read_size: default 16KiB; range 1KiB..2MiB; oversized records fail boundedly.
# MongoDB URI: mongodb:// with one host and explicit port, without userinfo.
# mongodb+srv, multi-host and replica-set topology discovery are unsupported.
# Search URL: http:// or https:// server origin. Auth and CA require HTTPS.
# Backend startup qualifies connectivity/product and supported server policy.
# Both adapters accept separate username/password, or username_file/password_file.
# Each value and its corresponding file are mutually exclusive; both username
# and password sources must be supplied together. Text is bounded to 128/256 bytes.
# Relative credential paths resolve from this file's directory; one final LF/CRLF
# is removed. Files must be regular and are read only during explicit Load/check.
# Search connection.ca_file is an optional PEM trust bundle used at startup;
# omit it to use system trust, and never disable certificate/hostname verification.
stores:
  - name: mongo
    mongodb:
      uri: mongodb://127.0.0.1:27017/?directConnection=true
    max_concurrency: 2
    max_batch_operations: 32
    batch_collect: 5ms
    max_read_size: 16KiB
  - name: search
    search:
      url: https://127.0.0.1:9200
      connection:
        username: weir
        password: change-me
        ca_file: /etc/weir/ca.pem
    max_concurrency: 2
    max_batch_operations: 32
    batch_collect: 5ms
    max_read_size: 16KiB
