# Weir local Store configuration reference
#
# Copy to routes.yaml, select Stores and edit backend values. Pair with an edited
# weir.yaml copied from weir.reference.yaml:
#   weir check --config weir.yaml --routes routes.yaml
#   weir serve --config weir.yaml --routes routes.yaml
# --routes defaults to "" (no local Stores); this reference is not auto-discovered.
# check validates the entire graph and resolves credential files without backend,
# DNS, listener or CA access. serve qualifies backends and reads CA files.
# Changes require a restart. Example credentials and CA paths must be replaced.
#
# Syntax: one YAML mapping, exact lowercase keys, at most 128KiB/12 nested levels.
# Unknown/duplicate keys, multiple documents, anchors/aliases/merge keys and
# explicit tags are rejected. Strings are literal, without expansion. Sizes and
# durations are strings. Omit optional scalars for defaults; null is not omission.
# Optional adapter/authentication/tls blocks may be null; Store entries may not.
# Lua and Execute flow-control settings belong in the process document.
#
# Default: no Stores. At most 16 unique Stores; each requires exactly one adapter.
# Request URIs choose database/collection/index; peer discovery learns remote Stores.
# Hosting Stores requires listeners.application in the process document.
stores:
  - # Unique name: 1..63 lowercase letters/digits/internal hyphens.
    name: mongo

    backend:
      # TCP/DNS/TLS connection establishment only. Default: 2s; positive duration.
      # Business IO and server selection follow the caller's context.
      connect_timeout: 2s
      # Completed target qualification entries. Default: 64; integer >= 0.
      # 0 disables caching; pending checks do not occupy this capacity.
      metadata_cache_entries: 64
      # Encoded record command/exchange chunk target. Default: 32MiB; >= 4MiB.
      # Larger scheduled batches split instead of failing. MongoDB also observes
      # its advertised BSON command boundary (normally 16MiB). Its response pages
      # use a document-count hint only below that native boundary; MongoDB's own
      # response paging remains authoritative. This is not a Lua workspace budget.
      # Search record request/response groups use this target directly.
      # Scan has its own fetch/publication budgets; Native keeps protocol bounds.
      max_exchange_bytes: 32MiB

      mongodb:
        # Standard mongodb://, one explicit IP/DNS host:port, at most 4096 bytes.
        # No credentials, database path, SRV/multi-host or topology options.
        # Accepted URI options: directConnection=true, serverMonitoringMode=poll,
        # authSource, authMechanism=SCRAM-SHA-256 and tls=true.
        # Auth requires credentials in backend.authentication plus explicit
        # authSource, SCRAM-SHA-256 and tls=true. TLS options require credentials.
        # Authenticated example:
        # mongodb://mongo.example:27017/?authSource=admin&authMechanism=SCRAM-SHA-256&tls=true
        # CA files belong in backend.tls.ca_file; URI tlsCAFile is rejected.
        uri: mongodb://127.0.0.1:27017/?directConnection=true
        pool:
          # Connection creation workers. Default: 2; 0 selects 2.
          # Native driver goroutines for connection-establishment bursts.
          # This does not cap active connections or backend operations.
          max_connecting: 2

      # Optional, shared layout for MongoDB SCRAM and Search HTTP Basic auth.
      # Omit for no authentication. Credentials require both paired sources.
      # authentication:
      #   # Valid UTF-8, 1..128 bytes, no controls; Search also forbids colons.
      #   # Default: "". Mutually exclusive with username_file.
      #   username: ""
      #   # Valid UTF-8, 1..256 bytes, no controls; spaces/punctuation preserved.
      #   # Default: "". Mutually exclusive with password_file.
      #   password: ""
      #   # Path at most 2048 UTF-8 bytes, nonblank, no control characters.
      #   # Relative paths resolve from this routes document's directory. Symlinks
      #   # may target regular files. Load/check reads once and removes one final
      #   # LF/CRLF only. Content follows the corresponding credential byte bound.
      #   # Default: "". Example: secrets/mongo-username.
      #   username_file: ""
      #   # Same rules as username_file. Example: secrets/mongo-password.
      #   password_file: ""
      # Optional custom CA; omit for system trust roots. Requires native TLS.
      # tls:
      #   # PEM bundle, regular file <=256KiB, UTF-8 path <=2048 bytes/no controls.
      #   # Replaces system roots; hostname verification remains enabled.
      #   # Relative paths use process cwd; prefer absolute paths.
      #   # Read only during serve/startup. No insecure-verification switch.
      #   ca_file: /etc/weir/ca.pem

    # Every command type uses this Store waiting queue, including Scan and Native.
    # Only waiting inputs occupy capacity; dispatch releases it. Full queues wait
    # for space or caller cancellation. This does not cap active execution.
    queue:
      # Waiting operations. Default: 1024; 0 selects 1024; positive integer.
      max_operations: 1024
      # Waiting input plus scheduler metadata. Default: 32MiB; positive size.
      # Must fit the platform integer and at least one entry's metadata.
      max_bytes: 32MiB

    # Aggregate compatible waiting work without collecting it for a timed delay.
    batching:
      # Operations per scheduled batch. Default: 32; 0 selects 32; positive integer.
      max_operations: 32
      # Input plus scheduler metadata per batch. Default: 8MiB; positive size.
      # One input must fit; Scan/Native use singleton plans. Does not cap RPCs.
      max_bytes: 8MiB

    # Retained fetch/publication batch size; total Scan output is not limited.
    scan:
      # Default: 128; integer 1..256, or 0 selects 128.
      max_batch_documents: 128
      # Default: 4MiB; >=2MiB, fits platform integer plus result framing.
      # Smaller native pages are learned automatically.
      max_batch_bytes: 4MiB

  - name: search
    backend:
      # Connection, cache and exchange settings have the same defaults above.
      connect_timeout: 2s
      metadata_cache_entries: 64
      max_exchange_bytes: 32MiB
      search:
        # One http:// or https:// IP/DNS origin and explicit port; <=1024 bytes.
        # No userinfo, path/trailing slash, query or fragment. Requests choose index.
        # Authentication or custom CA requires HTTPS. Omit auth/tls for system roots.
        url: https://127.0.0.1:9200
      authentication:
        # Example paired credentials. Replace values or use paired file sources.
        # Field bounds/source rules are shared with MongoDB above.
        username: weir
        password: change-me
        username_file: ""
        password_file: ""
      tls:
        # Example custom trust bundle. Replace, or omit tls for system roots.
        # The path/read/trust rules are shared with MongoDB above.
        ca_file: /etc/weir/ca.pem
    # Omitted queue, batching and scan groups use the documented defaults above.
