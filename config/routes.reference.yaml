# Weir local Store configuration reference.
# Loading, syntax and runtime semantics: ../docs/configuration.md
# Replace example credentials and CA paths before use. Changes require a restart.

# Default: no Stores. Store names are unique; each requires exactly one adapter.
# Hosting Stores requires listeners.application in the process document.
stores:
  - # Unique name: lowercase letters/digits/internal hyphens, nonempty.
    name: mongo

    backend:
      # TCP/DNS/TLS connection establishment only. Default: 2s; positive duration.
      # Business IO and server selection follow the caller's context.
      connect_timeout: 2s
      # Encoded record command/exchange chunk target. Default: 32MiB; positive size.
      # Larger scheduled batches split; one larger item proceeds alone.
      # MongoDB also respects its advertised BSON command boundary.
      max_exchange_bytes: 32MiB

      mongodb:
        # Standard mongodb://, at most 4096 bytes; every IP/DNS seed has a port.
        # Discovery: 1..7 seeds + replicaSet; directConnection absent or false.
        # Set name: 1..64 ASCII letters/digits/_/-, a Weir profile constraint,
        # not MongoDB's maximum name or replica-set membership size.
        # Direct: 1 endpoint, no replicaSet; directConnection absent or true.
        # Direct mode intentionally isolates one member and provides no failover.
        # No userinfo, database path, fragments, SRV, mongos or load balancing.
        # Accepted URI options: replicaSet, directConnection,
        # serverMonitoringMode=poll, authSource, authMechanism=SCRAM-SHA-256,
        # tls=true. Duplicate/unknown options and canonical duplicate seeds fail.
        # Auth requires separate credentials plus explicit authSource, SCRAM and
        # TLS. Member certificates verify each actual discovered hostname/IP.
        # Authenticated discovery example:
        # mongodb://mongo-a:27017,mongo-b:27017/?replicaSet=orders&authSource=admin&authMechanism=SCRAM-SHA-256&tls=true
        # CA files belong in backend.tls.ca_file; URI tlsCAFile is rejected.
        uri: mongodb://127.0.0.1:27017/?directConnection=true
        # Completed target qualification entries. Default: 64; integer >= 0.
        # 0 disables caching; pending checks do not occupy this capacity.
        metadata_cache_entries: 64
        # Connection creation workers PER MEMBER POOL. Default: 2; 0 selects 2.
        # Neither this nor the seed bound caps total topology/data sockets.
        # This does not cap active connections or backend operations.
        max_connecting: 2
        # Total confirmed-conflict transaction attempts, including the first.
        # Default: 5; 0 selects 5; 1 disables retries. Never replays unknown writes.
        # The same bound applies separately to confirming one transaction commit.
        retry_attempts: 5
        # Pause between transaction attempts or same-commit confirmations.
        # Default: 5ms; nonnegative duration; 0s disables the pause.
        retry_backoff: 5ms

      # Optional, shared layout for MongoDB SCRAM and Search HTTP Basic auth.
      # Omit for no authentication. Credentials require both paired sources.
      # authentication:
      #   # Nonempty valid UTF-8, no controls; Search also forbids colons.
      #   # Default: "". Mutually exclusive with username_file.
      #   username: ""
      #   # Nonempty valid UTF-8, no controls; spaces/punctuation preserved.
      #   # Default: "". Mutually exclusive with password_file.
      #   password: ""
      #   # UTF-8 path, nonblank, no control characters.
      #   # Relative paths resolve from this routes document's directory. Symlinks
      #   # may target regular files. Load/check reads once and removes one final
      #   # LF/CRLF only. Content follows the corresponding credential text rules.
      #   # Default: "". Example: secrets/mongo-username.
      #   username_file: ""
      #   # Same rules as username_file. Example: secrets/mongo-password.
      #   password_file: ""
      # Optional custom CA; omit for system trust roots. Requires native TLS.
      # tls:
      #   # PEM bundle, regular file, UTF-8 path without controls.
      #   # Replaces system roots; hostname verification remains enabled.
      #   # Relative paths use process cwd; prefer absolute paths.
      #   # Read only during serve/startup. No insecure-verification switch.
      #   ca_file: /etc/weir/ca.pem

    # Bounds waiting inputs; dispatch releases capacity. Full queues wait for
    # space or caller cancellation. Native output uses the Node's shared
    # execution-memory account independently of these input queue bounds.
    queue:
      # Waiting operations. Default: 1024; 0 selects 1024; positive integer.
      max_operations: 1024
      # Waiting input plus scheduler metadata. Default: 32MiB; positive size.
      # Must fit the platform integer. A larger input occupies an empty queue alone.
      max_bytes: 32MiB

    # Aggregate compatible waiting work within explicit size and wait bounds.
    batching:
      # Operations per scheduled batch. Default: 128; 0 selects 128; positive integer.
      max_operations: 128
      # Input plus scheduler metadata per batch. Default: 4MiB; positive size.
      # A larger input executes alone; Native uses singleton plans.
      max_bytes: 4MiB
      # Simultaneous backend executions per Store. Default: 16.
      # Omit for the default; explicit 0 keeps executions unlimited.
      # Positive values retain waiting work for natural batching and backpressure.
      # Includes Search visibility waits. Native output releases its slot while
      # retaining Node memory ownership, then fairly regains a slot before more IO.
      max_in_flight: 16
      # Maximum write collection wait from the oldest eligible admission.
      # Default: 20ms; nonnegative duration; 0s disables collection.
      # Full batches bypass collection.
      # Read, Native, drain and shorter caller deadlines bypass this wait.
      # Reads and mutations form separate batches in the same queue; reads do not
      # flush write collection. Both share the Store's max_in_flight budget.
      max_wait: 20ms

  - name: search
    backend:
      # Connection establishment only. Default: 2s; positive duration.
      connect_timeout: 2s
      # Record exchange chunk target. Default: 32MiB; positive size.
      max_exchange_bytes: 32MiB
      search:
        # One http:// or https:// IP/DNS origin and explicit port.
        # No userinfo, path/trailing slash, query or fragment. Requests choose index.
        # Authentication or custom CA requires HTTPS. Omit auth/tls for system roots.
        url: https://127.0.0.1:9200
        # Total confirmed-version-conflict attempts, including the first.
        # Default: 5; 0 selects 5; 1 disables retries.
        retry_attempts: 5
        # Reap unused pooled HTTP connections after this time; no business deadline.
        # Default: 30s; nonnegative duration; 0s disables expiry.
        idle_timeout: 30s
      authentication:
        # Example paired credentials. Replace values or use paired file sources.
        # Field bounds/source rules are shared with MongoDB above.
        username: weir
        password: change-me
        username_file: ""
        password_file: ""
      tls:
        # Example custom trust bundle. Replace, or omit tls for system roots.
        # The path/read/trust rules are shared with MongoDB above.
        ca_file: /etc/weir/ca.pem
