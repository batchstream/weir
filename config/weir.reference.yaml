# Weir process configuration reference.
# Loading, syntax and runtime semantics: ../docs/configuration.md
# Omit optional fields for defaults. Changes require a restart.

# Application business/Resolve and peer directory listeners.
# Required: yes, at least one child address must be nonempty. Default: both disabled.
# Nodes hosting local Stores must enable application.
listeners:
  # Address for SDK Resolve initialization and local business traffic.
  # Required: one of application/peer. Default: "" (disabled).
  # Allowed: explicit IPv4:port or [IPv6]:port, port 0..65535; no DNS/URL syntax.
  # Port 0 requests a random port. Use a fixed port for normal deployments.
  # A wildcard bind (0.0.0.0 or ::) hosting Stores needs discovery.advertise.
  application: "127.0.0.1:7447"

  # Address for directory synchronization between Weir nodes.
  # Required: one of application/peer. Default: "" (disabled).
  # Allowed: the same IP:port format as application. Nonzero listener addresses
  # must not overlap, including an unspecified address and a specific IP.
  # A wildcard peer bind needs discovery.peer_address or peer_address_env.
  peer: ""

# Independent HTTP diagnostics: /livez, /readyz and /metrics.
# Required: no. Default: disabled until address is set.
diagnostics:
  # Diagnostic listener address.
  # Required: no. Default: "" (disabled).
  # Allowed: explicit IP:port, port 0..65535. Loopback is required unless
  # allow_intranet is true.
  address: "127.0.0.1:7449"

  # Permit a diagnostic listener on a non-loopback interface.
  # Required: no. Default: false. Allowed: true | false.
  # true requires a nonempty address.
  allow_intranet: false

  # HTTP header/read/write/idle deadline. Default: 1s; positive duration.
  # Independent of business RPC contexts and backend IO.
  timeout: 1s

# Transport connection and stream progress deadlines.
transport:
  timeouts:
    # Maximum wait for transport/stream progress.
    # Required: no. Default: "30s". Allowed: positive duration.
    # Slow or stalled stream publication is canceled when progress stops for
    # this duration. Connection keepalive has independent settings below.
    stall: "30s"

    # New gRPC connection handshake. Default: 5s; positive duration.
    handshake: 5s

    # Idle gRPC connection expiry. Default: 1m; 0s disables expiry.
    # Neither handshake nor idle applies a whole-request business deadline.
    idle: 1m

  # Per Execute stream, admitted plus publishing records. Default: 32; 0 selects 32.
  # Positive integer. Pauses only a slow stream; does not cap RPCs or backend work.
  # Applies equally to every Store hosted by this process.
  max_pending_records: 32

  # Connection health checks; independent of RPC progress and caller deadlines.
  keepalive:
    # Send a gRPC ping after this interval without connection activity.
    # Default: 30s; duration >=1s (gRPC native minimum). Applies to both listeners.
    interval: 30s
    # Wait for that ping's acknowledgement. Default: 5s; positive duration.
    timeout: 5s

# Optional peer directory configuration. Uncomment this block when needed.
# The defaults below keep a standalone node without explicit advertisements.
# Enable listeners.peer before setting peer_address, peer_address_env or seeds.
# discovery:
#   # Local announcement lifetime. Default: 60s; positive whole milliseconds.
#   # Must exceed 2 * sync_timeout + sync_interval, covering peer and seed exchange.
#   lease: 60s
#
#   # One cadence for local lease renewal, peer synchronization and seed discovery.
#   # Default: 1s; positive duration.
#   sync_interval: 1s
#
#   # Deadline of each peer exchange. Default: 2s; positive duration.
#   sync_timeout: 2s
#
#   # Stable identity of replicas serving equivalent local Store definitions.
#   # Required: no. Default: "" (a new random standalone group at startup).
#   # Allowed: nonempty printable ASCII without spaces, or "" for default.
#   # Example: "catalog". Set the same explicit value on equivalent replicas.
#   group: ""
#
#   # Reachable peer address advertised to other nodes, distinct from the bind.
#   # Required: for a wildcard peer listener unless peer_address_env is set.
#   # Default: "" (use the concrete bound peer address when peer is enabled).
#   # Allowed: IPv4:port, [IPv6]:port or DNS:port, port 1..65535.
#   # No URL/resolver prefixes, wildcard/multicast IPs or IPv6 zone identifiers.
#   # Example: "node-a.example:7448". Requires listeners.peer to be enabled.
#   # Mutually exclusive with peer_address_env.
#   peer_address: ""
#
#   # Environment variable supplying the complete advertised peer host:port.
#   # Required: no. Default: "" (do not read an environment variable).
#   # Allowed: ASCII letters, digits or underscores, starting with a
#   # letter or underscore. Example: "WEIR_PEER_ADDRESS".
#   # Its value must satisfy peer_address and be present at Load/check time.
#   # Mutually exclusive with peer_address; no other string is expanded.
#   peer_address_env: ""
#
#   # Initial peer endpoints used to learn and synchronize the Store directory.
#   # Required: no. Default: [] (no bootstrap peers).
#   # Allowed: unique endpoints with the same format as peer_address.
#   # DNS case, trailing dot and port spelling are normalized for duplicates.
#   # Example: ["seed.example:7448"]. Requires listeners.peer to be enabled.
#   # These are peer endpoints, not backend or application endpoints.
#   seeds: []
#
#   # Application endpoints returned to SDK clients for locally hosted Stores.
#   # Required: when hosting Stores on a wildcard application listener.
#   # Default: [] (advertise the concrete bound application address for Stores).
#   # Allowed: unique endpoints with the same format as peer_address.
#   # Example: ["catalog.example:7447", "192.0.2.10:7447"]. Advertise addresses
#   # reachable by clients; a shared DNS name can identify multiple replicas.
#   advertise: []

# Process lifecycle deadlines, independent of business request contexts.
lifecycle:
  # Startup assembly/qualification. Default: 5s; positive duration.
  startup_timeout: 5s
  # Graceful drain before cancellation. Default: 5s; positive duration.
  # Align Kubernetes terminationGracePeriodSeconds with this and preStop time.
  shutdown_timeout: 5s
  # Bound resource release after caller cancellation or forced process drain.
  # Default: 2s; positive duration. Shared by Store and backend cleanup.
  # Shutdown can require up to two cleanup phases after the drain deadline.
  cleanup_timeout: 2s

overload:
  # Compare actual use with automatically discovered process/container capacity.
  memory:
    # Latch overload at this percentage. Default: 80; integer 1..100.
    high_watermark: 80
    # Resume when every trustworthy scope is below this percentage. Default: 70.
    # Integer 1..high_watermark-1. Hysteresis avoids toggling on each sample.
    low_watermark: 70
    # Process/container sampling cadence. Default: 100ms; positive duration.
    sample_interval: 100ms
    # The CLI automatically gives Go 80% of this recovery-watermark budget
    # (56% of capacity with defaults), leaving room for non-Go resident memory.
    # Explicit GOMEMLIMIT takes precedence. The OS limit remains the hard boundary.

# VM limits shared by every local Store.
lua:
  # Default: 0 (no instruction budget), or a positive instruction count.
  max_instructions: 0
  # Default: 0 (VM native default 10000), or a positive call depth.
  max_call_depth: 0
  # Default: 0 (VM native default 1000000), or positive stack slots.
  max_stack_slots: 0
