# Weir configuration reference.
# Loading and runtime semantics: ../docs/configuration.md
# Omit optional fields for defaults. Changes require a restart.

listeners:
  # Address clients connect to; serves StoreService for every Store below.
  # Required. An explicit IPv4:port or [IPv6]:port; no DNS names. Port 0
  # requests a random port; use a fixed port for normal deployments.
  application: "127.0.0.1:7447"

  # HTTP diagnostics: /livez, /readyz and /metrics.
  # Optional; omit to disable. Same address rules as application, and must not
  # overlap it. Bind a non-loopback address only on a trusted network.
  diagnostics: "127.0.0.1:7449"

# Drain admitted work for up to this long after SIGTERM before cancelling it.
# Each Store then gets a fixed 2s to cancel remaining work, end MongoDB
# sessions and close connections. Optional; omitted or 0s selects 5s.
shutdown_timeout: 5s

# Stores this process hosts. Optional; default none. Names are unique.
stores:
  - # Lowercase letters, digits and internal hyphens.
    name: mongo

    mongodb:
      # Standard mongodb://, at most 4096 bytes; every IP/DNS seed has a port.
      # Discovery: 1..7 seeds + replicaSet; directConnection absent or false.
      # Set name: 1..64 ASCII letters/digits/_/-.
      # Direct: 1 endpoint, no replicaSet; directConnection absent or true.
      # Direct mode isolates one member and provides no failover.
      # No userinfo, database path, fragments, SRV, mongos or load balancing.
      # Accepted URI options: replicaSet, directConnection,
      # serverMonitoringMode=poll, authSource, authMechanism=SCRAM-SHA-256,
      # tls=true. Duplicate/unknown options and canonical duplicate seeds fail.
      # Authentication requires the credentials below plus explicit authSource,
      # SCRAM and TLS. Member certificates verify each discovered hostname/IP.
      # Example:
      # mongodb://mongo-a:27017,mongo-b:27017/?replicaSet=orders&authSource=admin&authMechanism=SCRAM-SHA-256&tls=true
      # CA files belong in tls.ca_file; URI tlsCAFile is rejected.
      uri: mongodb://127.0.0.1:27017/?directConnection=true

    # Optional. MongoDB SCRAM or Search HTTP Basic credentials. Each of
    # username and password comes from exactly one of its value or its file.
    # authentication:
    #   # Nonempty valid UTF-8 without control characters; Search also forbids
    #   # colons in the username.
    #   username: ""
    #   password: ""
    #   # Relative paths resolve from this file's directory. Load reads each
    #   # file once and removes one final LF or CRLF.
    #   username_file: secrets/mongo-username
    #   password_file: secrets/mongo-password

    # Optional custom CA, replacing system roots. Requires TLS to the backend.
    # tls:
    #   # PEM bundle, read at startup. Relative paths resolve from this file.
    #   ca_file: /etc/weir/ca.pem

    # Optional. How queued records combine into backend executions.
    batching:
      # Records per execution. Default: 128.
      max_operations: 128
      # Request bytes per execution. Default: 4MiB. A larger record runs alone.
      max_bytes: 4MiB
      # Wait for more writes after the oldest one arrives. Default: 20ms;
      # 0s executes immediately. Full batches, reads, Native commands, drain and
      # shorter caller deadlines do not wait.
      max_wait: 20ms
      # Concurrent backend executions per Store, including Search visibility
      # waits. Default: 16. Native commands use a separate limit of 64.
      max_in_flight: 16

  - name: search
    search:
      # One http:// or https:// IP/DNS origin with an explicit port. No
      # userinfo, path, query or fragment; requests choose the index.
      # Authentication or a custom CA requires HTTPS.
      url: https://127.0.0.1:9200
    authentication:
      # Example values; replace them or use username_file/password_file.
      username: weir
      password: change-me
    tls:
      ca_file: /etc/weir/ca.pem
