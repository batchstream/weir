# Weir basic configuration reference
#
# Program startup settings are configured here. Services, backend connections and
# routes are configured in a separate file selected with --routes.
# Both reference files contain real YAML with field documentation.
# Validate before starting:
#   weir check --config config/weir.yaml --routes config/routes.yaml
#   weir serve --config config/weir.yaml --routes config/routes.yaml
# The default CLI path is ./weir.yaml. Changes require a restart.
# --routes defaults to "": no routing file is read and no backend is assembled.
# Both CLI paths resolve from the working directory; files are not auto-discovered.

# Syntax: one YAML mapping per file; keys are exact lowercase names shown here.
# Unknown/duplicate keys, multiple documents, anchors, aliases, merge keys and
# explicit tags are rejected. Each file is limited to 128 KiB and 12 nested levels.
# Use true/false for booleans, integers for counts, and strings for text and units.
# Omit optional fields to use defaults; an empty value is YAML null, not omission.
# Basic fields must not be null. Optional routing adapter/connection blocks may
# be null; required fields still have to satisfy the rules below.
# Strings are literal: environment-variable substitution is not performed.

# Application and peer gRPC listeners.
# Required: yes, at least one child address must be nonempty. Default: both disabled.
# Allowed: a mapping with application and/or peer.
listeners:
  # Address for SDK/application traffic; ingress receives forwarding.hop_limit.
  # Required: one of application/peer. Default: "" (disabled).
  # Allowed: explicit IPv4:port or [IPv6]:port, port 0..65535; no DNS/URL syntax.
  # Port 0 requests a random port. Use a fixed port for normal deployments.
  application: "127.0.0.1:7447"

  # Address for requests forwarded by another Weir node.
  # Required: one of application/peer. Default: "" (disabled).
  # Allowed: the same IP:port format as application. Nonzero listener addresses
  # must not overlap, including an unspecified address and a specific IP.
  peer: ""

# Independent HTTP diagnostics: /livez, /readyz and /metrics.
# Required: no. Default: disabled. Allowed: the address/allow_intranet mapping below.
diagnostics:
  # Diagnostic listener address.
  # Required: no. Default: "" (disabled).
  # Allowed: explicit IP:port, port 0..65535. Loopback is required unless
  # allow_intranet is true. Readiness describes node lifecycle, not backend health.
  address: "127.0.0.1:7449"

  # Permit a diagnostic listener on a non-loopback interface.
  # Required: no. Default: false. Allowed: true | false.
  # true requires a nonempty address. Exec probes still target a loopback address.
  allow_intranet: false

# Process admission/overload budget, not an OS-enforced memory limit.
# Required: no. Default: "1GiB".
# Allowed: integer + B | KiB | MiB | GiB, from 64MiB through 64GiB inclusive.
# Examples: "67108864B", "512MiB", "1GiB". Fractional sizes are not accepted.
# Set the deployment/container memory limit separately.
memory: "1GiB"

# Shared ingress connection/session admission and RPC deadlines.
# Required: no. Default: all child defaults below. Allowed: this mapping.
transport:
  # Maximum accepted data-plane connections shared by application and peer.
  # Required: no. Default: 16. Allowed: integer 1..64.
  max_connections: 16

  # Maximum concurrent data-plane sessions shared by application and peer.
  # Required: no. Default: 4. Allowed: integer 1..64.
  max_sessions: 4

  # Total RPC lifetimes and stream-progress timeout.
  # Required: no. Default: all child defaults below. Allowed: this mapping.
  # Each value is a duration string, e.g. "500ms", "1.5s", "30s", "5m".
  # Supported units: ns, us/µs/μs, ms, s, m, h; combined forms such as "1m30s"
  # are accepted. Values must be positive and within each field's upper bound.
  timeouts:
    # Maximum lifetime of one finite Route batch.
    # Required: no. Default: "15m". Allowed: duration > 0 and <= 15m.
    route: "15m"

    # Maximum wait for transport/stream progress.
    # Required: no. Default: "30s". Allowed: duration > 0 and <= 30s.
    stall: "30s"

# Forwarding budget for requests arriving through the application listener.
# Required: no. Default: the child default below. Allowed: this mapping.
forwarding:
  # Initial remaining hop count; each peer forward consumes one hop.
  # Required: no. Default: 4. Allowed: integer 0..8.
  # 0 prevents forwarding; peer ingress uses the request's existing hop budget.
  hop_limit: 4
