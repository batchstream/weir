syntax = "proto3";
package weir.v1;
option go_package = "github.com/batchstream/weir/api/weir/v1;weirv1";

// StoreService is the public discovery and execution API. Initialize through
// ResolveStore, then connect directly to a returned Store endpoint for execution.
service StoreService {
  rpc ResolveStore(ResolveStoreRequest) returns (ResolveStoreResponse);
  // One finite stream selects a Store on its first valid request. The Store is
  // fixed for that stream; closing input and receiving final gRPC OK is required
  // for whole-stream success. The service never forwards business requests.
  rpc Execute(stream ExecuteRequest) returns (stream ExecuteResponse);
}
message ResolveStoreRequest { string store_name = 1; }
message ResolveStoreResponse {
  string store_name = 1;
  // Portable IP or DNS host:port endpoints. DNS may identify several replicas.
  repeated string endpoints = 2;
  uint64 cache_ttl_ms = 3;
}
// request_id is nonzero and strictly increasing within one RPC; gaps are allowed.
// call_payload is exactly one protobuf-encoded, versioned Call for store_name.
message ExecuteRequest {
  uint64 request_id = 1;
  string store_name = 2;
  bytes call_payload = 3;
}
// event_fragment carries a length-delimited protobuf Event sequence, split at
// arbitrary byte boundaries. A separate empty request_complete frame completes
// one request_id. An acknowledged write remains acknowledged if the stream fails;
// incomplete writes are indeterminate and must never be automatically replayed.
message ExecuteResponse {
  uint64 request_id = 1;
  bytes event_fragment = 2;
  bool request_complete = 3;
}
message Call {
  uint32 version = 1;
  oneof operation {
    ReadRequest read = 10;
    MutateRequest mutate = 11;
    ScanRequest scan = 12;
    NativeCall native = 13;
  }
}
message NativeCall { NativeOpen open = 1; bytes body = 2; }
message Event {
  uint32 version = 1;
  oneof value {
    Result result = 10;
    Document document = 11;
    NativeHead head = 12;
    bytes chunk = 13;
    ScanEnd scan_end = 14;
    NativeEnd native_end = 15;
  }
}
message Empty {}
message Document { string media_type = 1; bytes data = 2; }
enum FailureCode {
  FAILURE_CODE_UNSPECIFIED = 0;
  INVALID_ARGUMENT = 1;
  UNAUTHENTICATED = 2;
  PERMISSION_DENIED = 3;
  NOT_FOUND = 4;
  PRECONDITION_FAILED = 5;
  CONFLICT = 6;
  UNSUPPORTED = 7;
  RESOURCE_EXHAUSTED = 8;
  UNAVAILABLE = 9;
  CANCELLED = 10;
  DEADLINE_EXCEEDED = 11;
  INTERNAL = 12;
}
enum MutationOutcome {
  MUTATION_OUTCOME_UNSPECIFIED = 0;
  NOT_STARTED = 1;
  NOT_APPLIED = 2;
  APPLIED = 3;
  UNKNOWN = 4;
}
message Failure { FailureCode code = 1; string message = 2; }
message ReadRequest { string resource = 1; string read_media_type = 2; Document adapter_options = 3; }
message ReadResult {
  oneof result { Document document = 1; Empty missing = 2; Failure failure = 3; }
}
message MutateRequest {
  string resource = 1;
  Document adapter_options = 2;
  oneof action {
    Document put = 10;
    Document create = 11;
    Document replace = 12;
    Empty delete = 13;
    Transform atomic_transform = 14;
  }
}
message MutationResult { MutationOutcome outcome = 1; Failure failure = 2; }
message Transform { oneof form { ProgramTransform program = 1; Document backend_expression = 2; } }
message ProgramTransform { string runtime = 1; bytes source = 2; Document input = 3; }
// Execution DTOs correlate adapter results inside the final node.
message Operation { uint64 index = 1; oneof operation { ReadRequest read = 10; MutateRequest mutate = 11; } }
message Result { uint64 index = 1; oneof result { ReadResult read = 10; MutationResult mutation = 11; } }
message ScanRequest {
  string resource = 1;
  Document selector = 2;
  string read_media_type = 3;
  // One finite page. Zero uses 128; the maximum is 256 documents.
  uint32 page_size = 4;
  // Resume a completed page on any Weir instance serving this Store.
  bytes continuation_token = 5;
}
// Counts document Events in this finite page. A successful page has exactly one
// of exhausted or next_continuation_token. Commit its checkpoint only after the
// matching document count, request end frame, and final gRPC OK (EOF).
message ScanEnd {
  uint64 document_count = 1;
  Failure failure = 2;
  bytes next_continuation_token = 3;
  bool exhausted = 4;
}
// Response transport evidence only; never a normalized mutation result.
enum NativeCompletion {
  NATIVE_COMPLETION_UNSPECIFIED = 0;
  NATIVE_NOT_STARTED = 1;
  RESPONSE_COMPLETE = 2;
  RESPONSE_INCOMPLETE = 3;
}
message NativeOpen { string resource = 1; Document descriptor = 2; string body_media_type = 3; }
message NativeHead { Document metadata = 1; string body_media_type = 2; }
message NativeEnd { NativeCompletion completion = 1; Failure failure = 2; }
